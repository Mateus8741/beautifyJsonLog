name: Release (npm)

# Publishes @codewaveds/beautify-json-log to npm using Trusted Publishing (OIDC).
# No NPM_TOKEN is used: npm exchanges the GitHub OIDC token for a short-lived
# publish credential and generates provenance automatically.
# See .github/RELEASING.md for the one-time setup on npmjs.com.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm Trusted Publishing (OIDC)

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Read package metadata
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Check if version is already published
        id: check
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          published="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"
          if [ "$published" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION is already on npm, skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.check.outputs.exists != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.check.outputs.exists != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.check.outputs.exists != 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.exists != 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        run: npm publish --access public

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
